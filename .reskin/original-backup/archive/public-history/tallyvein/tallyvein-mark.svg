<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Tallyvein</title>
  <desc id="desc">The seam: a bold cyan tally rod on a dark field, cut end to end by a stepped vein drawn as seven field-coloured rectangles, leaving two interlocking halves.</desc>
  <rect width="256" height="256" fill="#0A0E17"/>
  <polygon points="48,60 80,28 176,28 208,60 208,196 176,228 80,228 48,196" fill="#38E8D0"/>
  <g fill="#0A0E17">
    <rect x="114" y="18" width="28" height="62"/>
    <rect x="94" y="68" width="48" height="20"/>
    <rect x="94" y="68" width="28" height="58"/>
    <rect x="94" y="114" width="68" height="20"/>
    <rect x="134" y="114" width="28" height="58"/>
    <rect x="114" y="160" width="48" height="20"/>
    <rect x="114" y="160" width="28" height="78"/>
  </g>
</svg>
